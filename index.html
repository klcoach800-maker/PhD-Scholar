<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PhD Scholar Academic Monitoring & RAC Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#14213d;--mut:#5b6784;--pri:#14306b;--pri2:#2f56b5;--gold:#c9a24b;--line:#e1e6f0;--ok:#1e8e5a;--info:#2563eb;--warn:#c78a00;--bad:#c62f3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--ink:#e8ecf7;--mut:#9aa7c7;--pri:#7aa2ff;--pri2:#5b86f0;--line:#27345a}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--ink:#e8ecf7;--mut:#9aa7c7;--pri:#7aa2ff;--pri2:#5b86f0;--line:#27345a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
:root[data-theme="dark"] header,:root:not([data-theme="light"]) header{}
header h1{font-size:16px;margin:0}header small{opacity:.8;display:block;font-size:12px}
header select,header button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:6px 8px;font:inherit}
header option{color:#000}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:8px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pri);color:#fff}
:root[data-theme="dark"] nav button.on{color:#0d1424}
main{max-width:1100px;margin:0 auto;padding:16px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.c h3{margin:0 0 10px;font-size:15px}.k{font-size:26px;font-weight:700;color:var(--pri)}.m{color:var(--mut);font-size:13px}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.Verified{background:var(--info)}.Completed{background:var(--ok)}.UnderReview,.ReportSubmitted{background:var(--warn)}.CorrectionRequired,.Urgent,.High{background:var(--bad)}.NotScheduled,.Low{background:#8792ad}.Scheduled,.Medium{background:#5b6fa8}.Open{background:var(--bad)}.Responded{background:var(--warn)}.Resolved{background:var(--ok)}
button.p,button.s{border:0;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.p{background:var(--pri);color:#fff}button.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] button.p{color:#0d1424}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
.tl{display:flex;overflow-x:auto;gap:0;padding:10px 0}.st{min-width:104px;text-align:center;position:relative;font-size:12px}
.st:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line)}.st:first-child:before{display:none}
.st.d:before{background:var(--ok)}.dot{position:relative;width:28px;height:28px;border-radius:50%;margin:0 auto 4px;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-size:12px}
.st.d .dot{background:var(--ok);border-color:var(--ok);color:#fff}.st.a .dot{border-color:var(--warn)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:22px 10px}
.pa{padding:6px 10px;border-left:4px solid;margin:6px 0;background:var(--bg);border-radius:6px}
@media print{header,nav,footer,button{display:none!important}}
body{background:radial-gradient(900px 420px at 95% -5%,#c9a24b26,transparent),radial-gradient(800px 500px at -5% 20%,#2f56b51f,transparent),var(--bg)}
header{background:linear-gradient(120deg,#050d22,#0b1b3a 45%,#1d3a7a);border-bottom:3px solid var(--gold)}
header h1{letter-spacing:.2px}header small{color:#e6c97a}
nav{box-shadow:0 4px 16px #0b1b3a14}nav button.on{background:linear-gradient(120deg,#0b1b3a,#1d3a7a);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
.c{box-shadow:0 8px 26px #0b1b3a14;border-top:3px solid var(--gold)}
button.p{background:linear-gradient(120deg,#0b1b3a,#2f56b5);color:#fff}:root[data-theme="dark"] button.p{color:#fff}:root[data-theme="dark"] nav button.on{color:#fff}
.lgw{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(900px 500px at 12% 8%,#2b4c9b66,transparent),radial-gradient(700px 500px at 92% 92%,#c9a24b38,transparent),linear-gradient(135deg,#050d22,#0b1b3a 55%,#14306b)}
.lgc{width:min(410px,100%);background:#ffffff12;backdrop-filter:blur(14px);border:1px solid #ffffff2e;border-top:3px solid var(--gold);border-radius:18px;padding:26px;color:#fff;box-shadow:0 24px 70px #000a}
.lgc input{background:#ffffff14;color:#fff;border-color:#ffffff33}.lgc h2{font-size:19px}
.gb{background:linear-gradient(120deg,#c9a24b,#ecd48a);color:#0b1b3a;font-weight:700;border:0;border-radius:10px;padding:11px;width:100%;margin-top:14px;cursor:pointer;font:inherit;font-weight:700}
</style></head><body>
<header><div><h1>PhD Scholar Academic Monitoring &amp; RAC Management System</h1><small>Track. Review. Communicate. Progress.</small></div>
<div class="row" style="max-width:400px;align-items:center"><span id="uinfo" style="flex:2"></span><button onclick="S.tab='pw';S.sel=null;go()">Password</button><button onclick="logout()">Sign out</button></div></header>
<nav id="nav"></nav><main id="app"></main>
<footer>© 2026 PhD Scholar Academic Monitoring &amp; RAC Management System<br><b>Designed by Hashim Veeran A</b></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAT=["Not Scheduled","Scheduled","Completed","Report Submitted","Under Review","Verified","Correction Required"],cls=s=>s.replace(/ /g,"");
const bd=s=>`<span class="b ${cls(s)}">${E(s)}</span>`;
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"Pending";
function seed(){const r=(d,s)=>({date:d,status:s,docs:[]});return{role:"scholar",uid:1,tab:"dash",sel:null,
stages:[1,2,3,4,5].map(n=>({id:"r"+n,name:"RAC "+n,req:true,on:true,ord:n})).concat([{id:"pv",name:"Pre-Viva",req:true,on:true,ord:99}]),
scholars:[
{id:1,name:"Veeran",sup:"Prof. M. Rajashekaran",title:"Altitude vs Sea-Level Training in Soccer Players",area:"Sports Physiology",stage:"Data Analysis",reg:"2024-09-01",exp:"2028-09-01",rac:{r1:r("2025-03-15","Verified"),r2:r("2025-09-20","Verified"),r3:r("2026-03-18","Completed"),r4:r("2026-09-12","Under Review"),r5:r("","Not Scheduled")},pubs:[{t:"Isokinetic asymmetries in football players",j:"JHSE",st:"In Preparation"}],prog:[{d:"2026-09-30",k:"Monthly",w:"VO2 max testing completed",f:"Chapter 4 draft"}]},
{id:2,name:"Ananya R",sup:"Dr. S. Meena",title:"CBT Self-Talk and Mental Health in Women Footballers",area:"Sports Psychology",stage:"Pilot Study",reg:"2025-01-10",exp:"2028-12-31",rac:{r1:r("2025-08-02","Verified"),r2:r("2026-02-14","Completed")},pubs:[],prog:[]},
{id:3,name:"Joseph K",sup:"Prof. M. Rajashekaran",title:"Plyometric Load and Agility in Youth Athletes",area:"Training Science",stage:"Thesis Writing",reg:"2023-06-15",exp:"2027-06-15",rac:{r1:r("2024-01-10","Verified"),r2:r("2024-07-20","Verified"),r3:r("2025-02-11","Verified"),r4:r("2025-09-05","Verified"),r5:r("2026-04-08","Report Submitted"),pv:r("","Scheduled")},pubs:[{t:"Plyometrics and agility",j:"IJPEHS",st:"Published"}],prog:[]}],
remarks:[{id:1,sid:1,by:"HOD",type:"RAC",stage:"RAC 4",text:"Please upload the signed RAC letter.",act:"Upload signed RAC 4 letter",due:"2026-10-20",pri:"High",st:"Open",resp:[],date:"2026-10-08"}],
hist:[{d:"2026-10-08",who:"HOD",sid:1,stage:"RAC 4",rem:"Upload signed letter",act:"Remark sent",st:"Open"}],
audit:[{d:new Date().toLocaleString(),u:"System",a:"Portal initialised",p:"-",n:"Seed data"}]}}
let S;try{S=JSON.parse(localStorage.getItem("racS"))}catch(e){}if(!S||!S.stages)S=seed();
const save=()=>{try{localStorage.setItem("racS",JSON.stringify(S))}catch(e){}};
const rev=()=>S.role=="supervisor"||S.role=="hod",me=()=>S.scholars.find(s=>s.id==S.uid)||S.scholars[0];
const stg=()=>S.stages.filter(s=>s.on).sort((a,b)=>a.ord-b.ord);
let CU=null;const who=()=>CU?CU.name:"System";
const log=(a,p,n)=>{S.audit.unshift({d:new Date().toLocaleString(),u:who(),a,p,n});save()};
const hist=(sid,stage,rem,act,st)=>S.hist.unshift({d:today(),who:who(),sid,stage,rem,act,st});
const R=(s,id)=>s.rac[id]||(s.rac[id]={date:"",status:"Not Scheduled",docs:[]});
const done=r=>r&&(r.status=="Completed"||r.status=="Verified");
const TABS={scholar:[["dash","Dashboard"],["me","My Profile"],["rac","RAC"],["rem","Remarks"],["msg","Messages"],["prog","Progress"],["pub","Publications"],["docs","Documents"],["hist","Review History"]],
staff:[["ov","Overview"],["sch","Scholars"]],
supervisor:[["ov","Overview"],["sch","Scholars"],["rem","Remarks"],["msg","Messages"],["rep","Reports"],["hist","Review History"]],
hod:[["ov","Overview"],["sch","Scholars"],["rem","Remarks"],["msg","Messages"],["rep","Reports"],["hist","Review History"],["aud","Audit Log"]],
admin:[["stg","RAC Stages"],["usr","Users & Scholars"],["aud","Audit Log"]]};
function setRole(r){S.role=r;S.tab=TABS[r][0][0];S.sel=null;go()}
function go(){document.getElementById("uinfo").innerHTML=CU?`<b>${E(CU.name)}</b><small>${({scholar:"PhD Scholar",supervisor:"Research Supervisor",hod:"Department Head",staff:"Administrative Staff",admin:"System Administrator"})[CU.role]} · ${E(CU.id)}</small>`:"";
document.getElementById("nav").innerHTML=CU&&CU.dflt?"":TABS[S.role].map(([k,l])=>`<button class="${S.tab==k?"on":""}" onclick="S.tab='${k}';S.sel=null;go()">${l}</button>`).join("");
const V={msg:msgV,me:meV,pw:pwV,dash,rac:racV,rem:remV,prog:progV,pub:pubV,docs:docsV,hist:histV,ov,sch:schV,rep:repV,aud:audV,stg:stgV,usr:usrV};
document.getElementById("app").innerHTML=CU&&CU.dflt?`<div class="pa" style="border-color:var(--bad)">🔑 First login: set a new password to continue.</div>`+pwV():(S.sel&&S.tab=="sch"?profile(S.sel):V[S.tab]());save()}
function timeline(s){const st=stg(),first=st.findIndex(x=>!done(s.rac[x.id]));
const items=[{n:"Registration",d:s.reg,ok:1},...st.map((x,i)=>({n:x.name,d:(s.rac[x.id]||{}).date,ok:done(s.rac[x.id]),a:i==first})),{n:"Thesis Submission"},{n:"Viva"},{n:"PhD Completed"}];
return`<div class="tl">${items.map(i=>`<div class="st ${i.ok?"d":""} ${i.a?"a":""}"><div class="dot">${i.ok?"✓":"○"}</div><b>${E(i.n)}</b><div class="m">${i.n=="Registration"||i.d||i.ok?fd(i.d):"Pending"}</div></div>`).join("")}</div>`}
function dash(){const s=me(),a=(CU||{}).att,st=stg(),n=st.filter(x=>done(s.rac[x.id])).length,pct=Math.round(n/st.length*100),my=S.remarks.filter(r=>r.sid==s.id&&r.st!="Resolved");
const pend=[];st.forEach(x=>{const r=s.rac[x.id];if(!r||r.status=="Not Scheduled")return;if(r.status=="Correction Required")pend.push(["r",`Correct ${x.name} submission`]);else if(!r.docs.length&&done(r))pend.push(["y",`Upload ${x.name} report/letter`]);else if(r.status=="Verified")pend.push(["g",`${x.name} Verified`])});
return`<h2>Welcome, ${E(s.name)}</h2><div class="g"><div class="c"><h3>Research Status</h3><div class="m">Stage</div><b>${E(s.stage)}</b><div class="m">Supervisor</div>${E(s.sup)||"—"}<div class="m">Registered / Expected completion</div>${fd(s.reg)} → ${fd(s.exp)}</div>
<div class="c"><h3>RAC Progress</h3><div class="k">${n}/${st.length}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="m">${pct}% milestones complete</div></div>
<div class="c"><h3>Attendance</h3><div class="k">${a===undefined?"—":a+"%"}</div><div class="bar"><i style="width:${a||0}%"></i></div><div class="m">${a===undefined?"Not updated by admin yet":"Updated by System Administrator"}</div></div><div class="c"><h3>Profile Status</h3><div class="bar"><i style="width:70%"></i></div><div class="m">Basic profile 70%. Academic Profile — Optional, never blocks access.</div></div></div>
<div class="c"><h3>Research Title</h3>${E(s.title)||'<span class="m">Not added yet. Add it in My Profile.</span>'}</div><div class="c"><h3>RAC Timeline</h3>${timeline(s)}</div>
<div class="g"><div class="c"><h3>Pending Actions</h3>${pend.map(([c,t])=>`<div class="pa" style="border-color:var(--${{r:"bad",y:"warn",g:"ok"}[c]})">${{r:"🔴",y:"🟡",g:"🟢"}[c]} ${E(t)}</div>`).join("")||'<span class="m">None</span>'}</div>
<div class="c"><h3>🔔 Notifications</h3>${my.map(r=>`<div class="pa" style="border-color:var(--bad)"><b>${E(r.stage)} — Action Required</b><br>“${E(r.text)}”<br><button class="p" onclick="S.tab='rem';go()">View Remark</button></div>`).join("")||'<span class="m">No new remarks</span>'}</div></div>`}
function racRow(s,x){const canEdit=S.role=="scholar"||rev();const r=R(s,x.id);return`<tr><td><b>${E(x.name)}</b>${x.req?"":' <span class="m">(optional)</span>'}</td><td>${canEdit?`<input type="date" value="${r.date}" onchange="setF(${s.id},'${x.id}','date',this.value)">`:fd(r.date)}</td>
<td>${rev()?`<select onchange="setF(${s.id},'${x.id}','status',this.value)">${STAT.map(t=>`<option ${t==r.status?"selected":""}>${t}</option>`).join("")}</select>`:bd(r.status)}</td>
<td>${r.docs.map(d=>`<div class="m">📄 ${E(d.n)} <small>(${d.k}, ${fd(d.d)}, ${E(d.by)})</small></div>`).join("")||'<span class="m">No documents</span>'}
${canEdit?`<div class="row" style="margin-top:4px"><select id="k${s.id}${x.id}"><option>RAC Report</option><option>RAC Letter</option><option>Additional Document</option></select><input type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="up(${s.id},'${x.id}',this)"></div>`:""}</td><td>${r.vby?E(r.vby)+"<br>"+fd(r.vd):"—"}</td></tr>`}
function racTbl(s){return`<div class="tw"><table><tr><th>RAC Stage</th><th>Meeting Date</th><th>Status</th><th>Documents (PDF, DOC, DOCX, JPG, PNG)</th><th>Verified By</th></tr>${stg().map(x=>racRow(s,x,true)).join("")}</table></div>`}
function racV(){const s=me();return`<h2>RAC Management</h2><div class="c">${timeline(s)}</div><div class="c">${racTbl(s)}</div>${pvBox(s,false)}`}
function setF(sid,id,f,v){const s=S.scholars.find(x=>x.id==sid),r=R(s,id),nm=S.stages.find(x=>x.id==id).name,p=r[f];r[f]=v;
if(f=="status"&&(v=="Verified")){r.vby=who();r.vd=today()}log(`${nm} ${f} changed (${s.name})`,p||"-",v);hist(sid,nm,`${f} updated`,v,r.status);go()}
function up(sid,id,el){const f=el.files[0];if(!f)return;if(!/\.(pdf|docx?|jpe?g|png)$/i.test(f.name)){alert("Allowed: PDF, DOC, DOCX, JPG, PNG");el.value="";return}
if(f.size>10485760){alert("Max 10 MB");el.value="";return}const s=S.scholars.find(x=>x.id==sid),r=R(s,id),k=document.getElementById("k"+sid+id).value;
r.docs.push({n:f.name,k,d:today(),by:who()});if(!rev()&&r.status!="Verified")r.status="Report Submitted";const nm=S.stages.find(x=>x.id==id).name;
log(`Uploaded ${k} for ${nm}`,"-",f.name);hist(sid,nm,k+" uploaded","Document uploaded","Under Review");S.remarks.filter(m=>m.sid==sid&&m.stage==nm&&m.st=="Open").forEach(m=>{m.st="Responded";m.resp.push({d:today(),t:"Uploaded "+f.name})});go()}
function remV(){const L=S.remarks.filter(r=>S.role=="scholar"?r.sid==me().id:true);
return`<h2>Remarks</h2>${rev()?remForm():""}${L.map(r=>{const s=S.scholars.find(x=>x.id==r.sid);return`<div class="c"><div class="row"><b>${E(r.stage)} — ${E(r.type)}</b><span>${bd(r.pri)} ${bd(r.st)}</span></div><div class="m">${rev()?E(s.name)+" · ":""}by ${E(r.by)} · ${fd(r.date)} · Deadline ${fd(r.due)}</div><p>“${E(r.text)}”</p><div class="m">Action: ${E(r.act||"—")}</div>${r.resp.map(x=>`<div class="pa" style="border-color:var(--pri2)">${fd(x.d)}: ${E(x.t)}</div>`).join("")}
${S.role=="scholar"&&r.st!="Resolved"?`<div class="row" style="margin-top:8px"><input id="rp${r.id}" placeholder="Write response…"><button class="p" onclick="respond(${r.id})">Respond</button><button class="s" onclick="S.tab='rac';go()">Upload Document</button></div>`:""}
${rev()&&r.st!="Resolved"?`<div class="row" style="margin-top:8px"><button class="p" onclick="close_(${r.id},'Resolved')">Verify / Resolve</button><button class="s" onclick="close_(${r.id},'Open')">Correction Required</button></div>`:""}</div>`}).join("")||'<div class="c m">No remarks.</div>'}`}
function remForm(){return`<div class="c"><h3>+ Add Remark</h3><div class="row"><div><label>Scholar</label><select id="fs">${S.scholars.map(s=>`<option value="${s.id}">${E(s.name)} (${E(s.roll||s.id)})</option>`).join("")}</select></div><div><label>Stage</label><select id="fst">${stg().map(x=>`<option>${E(x.name)}</option>`).join("")}</select></div><div><label>Remark Type</label><select id="ft">${["Academic","Research","RAC","Documentation","Administrative","Correction Required","Important","General"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Priority</label><select id="fp">${["Low","Medium","High","Urgent"].map(x=>`<option>${x}</option>`).join("")}</select></div></div>
<label>Remark</label><textarea id="fr" rows="2"></textarea><div class="row"><div><label>Action Required</label><input id="fa"></div><div><label>Deadline</label><input type="date" id="fd"></div></div><p><button class="p" onclick="addRem()">Send Remark</button></p></div>`}
function addRem(sid){const g=i=>document.getElementById(i).value;if(!g("fr").trim())return alert("Enter remark");const r={id:Date.now(),sid:+g("fs"),by:who(),type:g("ft"),stage:g("fst"),text:g("fr"),act:g("fa"),due:g("fd"),pri:g("fp"),st:"Open",resp:[],date:today()};S.remarks.unshift(r);hist(r.sid,r.stage,r.text,"Remark sent","Open");log("Remark added",r.stage,r.text);go()}
function respond(id){const t=document.getElementById("rp"+id).value.trim();if(!t)return;const r=S.remarks.find(x=>x.id==id);r.resp.push({d:today(),t});r.st="Responded";hist(r.sid,r.stage,r.text,"Scholar responded","Responded");log("Scholar responded",r.stage,t);go()}
function close_(id,st){const r=S.remarks.find(x=>x.id==id);r.st=st;hist(r.sid,r.stage,r.text,st=="Resolved"?"Verified by reviewer":"Correction required",st=="Resolved"?"Resolved":"Open");log("Remark status",r.st,st);go()}
function progV(){const s=me();return`<h2>Research Progress</h2><div class="c"><div class="row"><div><label>Type</label><select id="pk"><option>Monthly</option><option>Semester</option><option>Annual</option></select></div><div><label>Work completed</label><input id="pw"></div><div><label>Future plan</label><input id="pf"></div></div><p><button class="p" onclick="addProg()">Submit Progress</button></p></div>
<div class="c tw"><table><tr><th>Date</th><th>Type</th><th>Work completed</th><th>Future plan</th></tr>${s.prog.map(p=>`<tr><td>${fd(p.d)}</td><td>${p.k}</td><td>${E(p.w)}</td><td>${E(p.f)}</td></tr>`).join("")}</table></div>`}

S.users.push(u);return""}

const rowsFrom=cells=>{const key=h=>{h=String(h).toLowerCase().replace(/[^a-z0-9]/g,"");return/^(id|rollno|staffid|loginid|userid|rollnostaffid)$/.test(h)?"id":/^(name|fullname)$/.test(h)?"name":h=="role"?"role":/^(attendance|attendancepercent|attendancepercentage|att)$/.test(h)?"att":h};
const hd=(cells[0]||[]).map(key);return cells.slice(1).filter(r=>r.some(c=>String(c).trim())).map(r=>{const o={};hd.forEach((h,i)=>o[h]=r[i]);return o})};
const parseRows=txt=>{const L=txt.split(/\r?\n/).filter(x=>x.trim());if(!L.length)return[];const sp=L[0].includes("\t")?"\t":",";return rowsFrom(L.map(l=>l.split(sp).map(c=>c.trim().replace(/^"|"$/g,""))))};
async function importRows(rows){let ok=0;const bad=[];for(const r of rows){const e=await mkAcct(r.id,r.name,r.role,r.att);e?bad.push((r.id||"?")+": "+e):ok++}
log("Bulk import",ok+" added",bad.length+" skipped");const msg=`<b>${ok} accounts added.</b>${bad.length?"<br>Skipped:<br>"+bad.map(E).join("<br>"):""}`;go();document.getElementById("bm").innerHTML=msg}
function bulkFile(el){const f=el.files[0];if(!f)return;if(!/\.(xlsx|xls|csv)$/i.test(f.name)){alert("Use .xlsx, .xls or .csv");return}if(f.size>2097152){alert("Max 2 MB");return}
const csv=/csv$/i.test(f.name),r=new FileReader();r.onload=async()=>{try{if(csv)await importRows(parseRows(r.result));else{const wb=XLSX.read(r.result,{type:"array"});await importRows(rowsFrom(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""})))}}catch(e){document.getElementById("bm").textContent="Could not read file. Paste rows below instead."}};
csv?r.readAsText(f):r.readAsArrayBuffer(f)}
async function bulkPaste(){await importRows(parseRows(gv("bt")))}

function togU(id){const u=S.users.find(x=>x.id==id);if(u.id==CU.id)return;u.on=!u.on;log("Account "+id,u.on?"Disabled":"Active",u.on?"Active":"Disabled");go()}
function setAtt(id){const u=S.users.find(x=>x.id==id),p=u.att,v=attv(gv("at_"+id));u.att=v;u.attd=today();log("Attendance updated "+id,p===undefined?"-":p+"%",v===undefined?"-":v+"%");go()}
async function rstPw(id){const u=S.users.find(x=>x.id==id);u.pw=await H(u.id);u.dflt=true;log("Password reset to ID",id,"-");go()}
